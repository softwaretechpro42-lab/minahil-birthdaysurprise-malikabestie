<style>

</style></head><body>
<div id="bg"></div><div id="stage"></div><div id="fx"></div>
<div id="lock"><div class="card"><div class="lk">🔒</div><h1 class="ser" style="font-size:clamp(34px,10vw,44px);font-style:normal">For Minahil 💖</h1><p>Enter the secret password to unlock your birthday surprise 🎁</p>

<script>

function(){const cols=['#1E3A8A','#1D4ED8','#BFDBFE','#F0D6A3','#3B82F6','#DBEAFE','#1E40AF','#E8C887'];const pop=new Set();
const el=sc(`<h2 class="in">Pop these balloons, birthday girl! ♡ 🎈</h2><p class="in" style="animation-delay:.3s">Each balloon holds a little wish from me to you. 💌</p>
<div class="bg8">${wishes.map((w,i)=>`<button class="b8" data-i="${i}" aria-label="Balloon ${i+1}" style="--c:${cols[i]};--d:${2+i%4*.6}s;--l:${-i*.5}s;margin-top:${i%2*14}px"><span></span><em>✦</em></button>`).join('')}</div>
<p id="cnt">0 of 8 wishes found</p><div class="chips" id="ch"></div><button class="btn hid" id="c">Continue ♡ ✨</button>`);
function show(i){const w=document.createElement('div');w.className='wc';w.innerHTML=`<div class="card" role="dialog"><p style="font-size:12px;color:var(--bp);font-weight:700">Wish ${i+1} of 8</p><h2 class="ser" style="font-size:clamp(19px,5.2vw,23px);margin:8px 0 14px">${wishes[i]}</h2><button class="btn" style="padding:10px 24px">Close ♡ 💗</button></div>`;document.body.append(w);const x=()=>w.remove();w.onclick=e=>{if(e.target===w||e.target.tagName=='BUTTON')x()};cl.push(x)}
on(el,'click',e=>{const b=e.target.closest('.b8');if(!b)return;const i=+b.dataset.i;if(pop.has(i))return;const[x,y]=mid($('span',b)),k=cols[i];burst(x,y,22,['●','●','✦'],k);burst(x,y,8,['❤','♥','♡']);b.classList.add('x');pop.add(i);
$('#cnt',el).textContent=pop.size+' of 8 wishes found';const c=document.createElement('button');c.textContent='♡'+(i+1);c.setAttribute('aria-label','Reopen wish '+(i+1));c.onclick=()=>show(i);$('#ch',el).append(c);later(()=>show(i),380);if(pop.size==8)$('#c',el).classList.remove('hid')});
on($('#c',el),'click',()=>go(7))},

function(){const P=["Happy Birthday, my dearest Minahil! ❤️🎂","Today is your special day, my best friend, and I just want you to know how incredibly precious you are to me. Every moment with you feels like a gift, and I hope this new chapter of your life brings you endless happiness, beautiful memories, success, and everything your heart wishes for. 💕","You are the friend who stayed through every storm, who laughed with me until our stomachs hurt and held my hand when things got hard. You deserve all the love, care, and happiness in the world, and I promise to always be there for you, today and always. May your smile never fade, may your dreams always find their way to reality, and may life surprise you with the most beautiful things. 🦋","Thank you for being my person, for every laugh, every secret, every late-night talk and every little memory we share. I hope this little surprise brings a smile to your face, because making you happy is one of the sweetest feelings in my world. 🥰","Happy Birthday once again, my best friend, my forever sister at heart. Sending you all my love, today and always. 💖","Forever your best friend,<br>Malaika ♡ 💌"];
